<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KONFOR Bed Assembly</title>
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;background:#e4e6ea;overflow:hidden;font-family:system-ui}
#stage{width:1280px;height:720px;position:fixed;left:50%;top:50%;transform-origin:0 0;background:radial-gradient(1000px 560px at 50% 30%,#ffffff,#f0f0f0 70%,#e4e6ea)}
#c{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:#fffc;padding:6px 12px;border-radius:99px;color:#6b5636;font:13px system-ui}
.cap #c{display:none}#c input{width:300px}</style></head><body class="cap">
<div id="stage"><svg viewBox="0 0 1280 720" width="1280" height="720">
<line x1="140" y1="560" x2="1140" y2="560" stroke="#c9cdd6" stroke-width="2"/>
<ellipse id="sh" cx="640" cy="568" rx="400" ry="18" fill="#8a93a6" opacity="0"/>
<g id="legs"><path d="M330 500h26l-3 60h-20zM924 500h26l-3 60h-20z" fill="#a98b5c"/></g>
<g id="frame"><rect x="320" y="440" width="640" height="62" rx="10" fill="#d3bf98"/><rect x="342" y="456" width="596" height="30" rx="6" fill="none" stroke="#b89968" stroke-width="2" opacity=".7"/></g>
<g id="head"><rect x="292" y="240" width="48" height="262" rx="16" fill="#b89968"/><rect x="298" y="248" width="8" height="246" rx="4" fill="#cfb280"/><g fill="#a07f4c"><circle cx="318" cy="290" r="5"/><circle cx="318" cy="340" r="5"/><circle cx="318" cy="390" r="5"/><circle cx="318" cy="440" r="5"/></g></g>
<g id="deck"><g id="plate"><rect x="340" y="418" width="620" height="22" rx="4" fill="#a98b5c"/></g><g id="spr"></g>
<g id="foam"><rect x="344" y="354" width="612" height="32" rx="12" fill="#f1e6cf" stroke="#e0d0ae" stroke-width="2"/></g>
<g id="cover"><rect x="342" y="316" width="616" height="40" rx="18" fill="#fffaf0" stroke="#e6d9bd" stroke-width="2"/><path d="M370 336H930" stroke="#e3d5b5" stroke-width="2" stroke-dasharray="8 8"/></g>
<g id="pil"><rect x="372" y="286" width="124" height="34" rx="17" fill="#fffdf7" stroke="#eadfc7" stroke-width="2"/></g></g>
<g id="pis"><rect x="888" y="470" width="24" height="16" rx="4" fill="#8c6f45"/><line id="pc" stroke="#8c6f45" stroke-width="16" stroke-linecap="round"/><line id="pr" stroke="#f3ead7" stroke-width="7" stroke-linecap="round"/><circle id="pd" r="6" fill="#8c6f45"/></g>
<g id="logo" fill="#1e325a"><g id="fl" transform="translate(455 92)"></g><text id="lt" x="500" y="114" font-size="62" letter-spacing="7" font-family="Montserrat,'Segoe UI',Helvetica,Arial,sans-serif">KONFOR</text></g>
<text id="cap" x="640" y="660" text-anchor="middle" fill="#8c6f45" font-size="26" letter-spacing="3" font-family="Montserrat,'Segoe UI',Helvetica,Arial,sans-serif"></text>
<rect x="0" y="714" width="1280" height="6" fill="#d3d7df"/><rect id="bar" y="714" width="0" height="6" fill="#1e325a"/>
</svg></div>
<div id="c"><button id="pb">Pause</button><input id="sl" type="range" min="0" value="0"><span id="lb"></span></div>
<script>
const N=150,FPS=30,Q=new URLSearchParams(location.search),S=document.getElementById('stage'),$=s=>document.querySelector(s);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),sg=(f,a,b)=>cl((f-a)/(b-a)),ea=t=>1-Math.pow(1-t,3),bo=t=>1+2.2*Math.pow(t-1,3)+1.2*Math.pow(t-1,2);
const fly=(e,dx,dy,a,b,f,bn)=>{const t=sg(f,a,b),k=1-(bn?bo(t):ea(t));e.setAttribute('transform',`translate(${dx*k} ${dy*k})`);e.style.opacity=cl(t*3)};
$('#fl').innerHTML=[0,1,2,3,4].map(i=>`<g class="pt" transform="rotate(${i*72})"><path d="M0 -4C-15 -16 -14 -36 0 -46C14 -36 15 -16 0 -4Z"/><path d="M0 -12V-34" stroke="#f6efe2" stroke-width="2.5" fill="none"/></g>`).join('');
const pts=[...document.querySelectorAll('.pt')];
$('#spr').innerHTML=Array.from({length:13},(_,i)=>{const x=368+i*48.5;return`<path d="M${x} 418l12-7-24-7 24-7-24-7 12-7" fill="none" stroke="#8c6f45" stroke-width="3" stroke-linejoin="round"/>`}).join('');
const sp=[...document.querySelectorAll('#spr path')];
const CAPS=[[0,'Legs & frame'],[24,'Headboard'],[42,'Hydraulic lift'],[58,'Spring system'],[80,'Comfort layers'],[112,'Hydraulic lift opens the storage'],[132,'Ready to rest']];
function R(f){f=cl(f,0,N-1);
pts.forEach((p,i)=>{const t=ea(sg(f,i*2,i*2+14));p.setAttribute('transform',`rotate(${i*72}) scale(${t})`)});
$('#lt').style.opacity=ea(sg(f,8,26));
$('#sh').setAttribute('opacity',.28*sg(f,0,40));
fly($('#legs'),0,140,0,18,f);fly($('#frame'),0,120,10,32,f);fly($('#head'),-300,0,24,44,f);
fly($('#pis'),0,120,42,58,f);fly($('#plate'),0,-170,40,56,f);
sp.forEach((e,i)=>fly(e,0,-230,58+i*1.2,70+i*1.2,f,1));
fly($('#foam'),0,-170,80,94,f,1);fly($('#cover'),0,-190,90,104,f,1);fly($('#pil'),0,-150,98,111,f,1);
const A=18*(ea(sg(f,112,126))-ea(sg(f,132,146))),r=A*Math.PI/180;
$('#deck').setAttribute('transform',`rotate(${-A} 340 430)`);
const B=[900,478],D=[340+560*Math.cos(r),430-560*Math.sin(r)],C=[B[0]+(D[0]-B[0])*.55,B[1]+(D[1]-B[1])*.55];
const s=(id,a,b)=>{const e=$(id);e.setAttribute('x1',a[0]);e.setAttribute('y1',a[1]);e.setAttribute('x2',b[0]);e.setAttribute('y2',b[1])};
s('#pc',B,C);s('#pr',C,D);$('#pd').setAttribute('cx',D[0]);$('#pd').setAttribute('cy',D[1]);
let c='';CAPS.forEach(x=>{if(f>=x[0])c=x[1]});$('#cap').textContent=c;
$('#bar').setAttribute('width',1280*f/(N-1))}
window.renderFrame=R;window.TOTAL_FRAMES=N;
function fit(){const k=Q.has('capture')?1:Math.min(innerWidth/1280,(innerHeight-60)/720);S.style.transform=`scale(${k}) translate(-640px,-360px)`}
addEventListener('resize',fit);fit();
if(Q.has('capture')){document.body.className='cap';R(+Q.get('frame')||0)}else{
let f=0,p=1,l=performance.now();const sl=$('#sl'),b=$('#pb'),lb=$('#lb');sl.max=N-1;R(0);
b.onclick=()=>{p=!p;if(p&&f>=N-1)f=0;b.textContent=p?'Pause':'Play'};sl.oninput=()=>{f=+sl.value;R(f)};
(function L(t){if(p){f=Math.min(N-1,f+(t-l)/1000*FPS);R(f);sl.value=f;if(f>=N-1){f=0}}lb.textContent=Math.round(f)+1+'/'+N;l=t;requestAnimationFrame(L)})(l)}
</script></body></html>
