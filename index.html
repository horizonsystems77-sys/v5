<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD-bac9kfXCRvLrBR8GrfMn5E4YQ8rl41A",
        authDomain: "konfor-c1128.firebaseapp.com",
        projectId: "konfor-c1128",
        storageBucket: "konfor-c1128.firebasestorage.app",
        messagingSenderId: "986871870236",
        appId: "1:986871870236:web:22d2216996e46c978480d9",
        measurementId: "G-Z0975DMLLK"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // مزامنة المنتجات وعرضها مباشرة في شبكة المنتجات
    function renderFirebaseProducts() {
        db.collection('products').onSnapshot(snapshot => {
            const container = document.getElementById('cc');
            if (!container) return;

            // إزالة الكروت المضافة سابقاً لمنع التكرار
            const oldFbCards = container.querySelectorAll('.custom-card');
            oldFbCards.forEach(el => el.remove());

            snapshot.forEach(doc => {
                const item = doc.data();
                const card = document.createElement('div');
                card.className = 'custom-card';

                card.innerHTML = `
                    ${item.imageUrl ? `<img src="${item.imageUrl}" alt="${item.title}">` : '<div style="height:200px; background:#edf2f7; width:100%; border-radius:15px;"></div>'}
                    <h3>${item.title || 'منتج جديد'}</h3>
                    <p>${item.desc || ''}</p>
                    <div class="action-btns">
                        <a href="https://wa.me/963991310740" target="_blank" class="wa-btn">اطلب عبر واتساب</a>
                        ${item.pdfUrl ? `<a href="${item.pdfUrl}" target="_blank" download="catalog.pdf" class="pdf-link">PDF</a>` : ''}
                    </div>
                `;
                
                // إضافتها في بداية المعرض لكي تظهر أول المنتجات أمام العميل
                container.prepend(card);
            });
        });
    }

    // تشغيل الجلب بعد اكتمال القالب
    window.addEventListener('load', () => {
        setTimeout(renderFirebaseProducts, 800);
    });
</script>
