<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD-bac9kfXCRvLrBR8GrfMn5E4YQ8rl41A",
        authDomain: "konfor-c1128.firebaseapp.com",
        projectId: "konfor-c1128",
        storageBucket: "konfor-c1128.firebasestorage.app",
        messagingSenderId: "986871870236",
        appId: "1:986871870236:web:22d2216996e46c978480d9",
        measurementId: "G-Z0975DMLLK"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // جلب المنتجات وعرضها مباشرة في الحاوية cc
    function loadLiveProducts() {
        db.collection('products').onSnapshot(snapshot => {
            const container = document.getElementById('cc');
            if (!container) return;

            container.innerHTML = "";

            if (snapshot.empty) {
                container.innerHTML = "<p style='text-align:center; grid-column:1/-1; color:#666;'>لا توجد منتجات مضافة حالياً.</p>";
                return;
            }

            snapshot.forEach(doc => {
                const item = doc.data();
                const card = document.createElement('div');
                card.className = 'fb-product-card';

                let content = '';
                if (item.imageUrl) {
                    content += `<img src="${item.imageUrl}" alt="${item.title}">`;
                }
                content += `<h3>${item.title || 'بدون عنوان'}</h3>`;
                if (item.desc) {
                    content += `<p>${item.desc}</p>`;
                }
                if (item.pdfUrl) {
                    content += `<a href="${item.pdfUrl}" target="_blank" download="catalog.pdf" class="pdf-btn">تحميل الكتالوج (PDF)</a>`;
                }

                card.innerHTML = content;
                container.appendChild(card);
            });
        }, error => {
            console.error("خطأ في الاتصال بقاعدة البيانات:", error);
        });
    }

    window.addEventListener('DOMContentLoaded', loadLiveProducts);
</script>
