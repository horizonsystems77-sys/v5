<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD-bac9kfXCRvLrBR8GrfMn5E4YQ8rl41A",
        authDomain: "konfor-c1128.firebaseapp.com",
        projectId: "konfor-c1128",
        storageBucket: "konfor-c1128.firebasestorage.app",
        messagingSenderId: "986871870236",
        appId: "1:986871870236:web:22d2216996e46c978480d9",
        measurementId: "G-Z0975DMLLK"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    function loadFirestoreProducts() {
        db.collection('products').onSnapshot(snapshot => {
            const container = document.getElementById('cc');
            if (!container) return;

            // إبقاء المنتجات الحالية أو تفريغها حسب الحاجة
            container.innerHTML = "";

            if (snapshot.empty) {
                return;
            }

            snapshot.forEach(doc => {
                const item = doc.data();
                const card = document.createElement('div');
                card.className = 'fb-card';

                let html = '';
                if (item.imageUrl) {
                    html += `<img src="${item.imageUrl}" alt="${item.title}">`;
                }
                html += `<h3>${item.title || ''}</h3>`;
                if (item.desc) {
                    html += `<p>${item.desc}</p>`;
                }
                if (item.pdfUrl) {
                    html += `<a href="${item.pdfUrl}" target="_blank" download="catalog.pdf" class="btn-pdf">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                                تحميل الكتالوج (PDF)
                             </a>`;
                }
                card.innerHTML = html;
                container.appendChild(card);
            });
        }, error => {
            console.error("خطأ في جلب المنتجات من فايربيس:", error);
        });
    }

    // التشغيل بعد انتهاء تحميل كل مكونات DOM وملفات app.js
    window.addEventListener('load', function() {
        setTimeout(loadFirestoreProducts, 500);
    });
</script>
